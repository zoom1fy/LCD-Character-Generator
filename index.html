<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Design custom characters for HD44780 LCD modules, preview animations and generate Arduino code."
    />
    <title>Custom Character Generator for HD44780 LCD Modules</title>
    <!-- Инициализация темы до отрисовки страницы (только для предотвращения FOUC) -->
    <script>
      (function () {
        var stored = null;
        try {
          stored = localStorage.getItem('theme');
        } catch (e) {}
        var hasOverride = stored === 'light' || stored === 'dark';
        var system =
          window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            ? 'dark'
            : 'light';
        var theme = hasOverride ? stored : system;
        // meta[name="color-scheme"] — источник истины для нативных контролов и CSS color-scheme
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (meta) meta.content = hasOverride ? stored : 'light dark';
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.setAttribute('data-bs-theme', theme);
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="assets/css/preloader.css" rel="stylesheet" />
    <link href="assets/css/bootstrap.min.css" rel="stylesheet" />
    <link href="assets/css/bootstrap-icons.css" rel="stylesheet" />
    <!-- Highlight.js стили -->
    <link href="assets/css/highlight-github.min.css" rel="stylesheet" />

    <link rel="stylesheet" href="./assets/css/main.css" />
    <link rel="stylesheet" href="./assets/css/theme-toggle-but.css" />
    <link rel="icon" type="image/png" href="./assets/imgs/logo.png" />
    <link rel="stylesheet" href="./assets/css/arduino-code-gen.css" />
  </head>

  <body>
    <a class="skip-link" href="#main" data-i18n="skip_to_content">Skip to content</a>

    <div id="preloader">
      <div class="spinner"></div>
      <p class="loading-text" data-i18n="loading">Loading...</p>
    </div>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
      <div class="container-fluid">
        <!-- Логотип и название -->
        <a class="navbar-brand d-flex align-items-center" href="#">
          <img src="./assets/imgs/logo.png" width="40" height="40" alt="Logo" class="me-2" />
          <span>LCD Character Generator</span>
        </a>

        <!-- Кнопка для мобильных -->
        <button
          class="navbar-toggler"
          type="button"
          data-bs-toggle="collapse"
          data-bs-target="#navbarContent"
          aria-controls="navbarContent"
          aria-label="Toggle navigation"
          data-i18n-aria-label="toggle_navigation"
        >
          <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Основное содержимое навбара -->
        <div class="collapse navbar-collapse" id="navbarContent">
          <ul
            class="navbar-nav me-auto"
            role="tablist"
            aria-label="Main sections"
            data-i18n-aria-label="sections"
          >
            <li class="nav-item" role="presentation">
              <button
                type="button"
                class="nav-link active"
                id="customCharacterLink"
                role="tab"
                aria-selected="true"
                aria-controls="tab-pixel"
              >
                <span data-i18n="custom_character">Custom Character</span>
              </button>
            </li>
            <li class="nav-item" role="presentation">
              <button
                type="button"
                class="nav-link"
                id="arduinoCodeLink"
                role="tab"
                aria-selected="false"
                aria-controls="tab-code"
                tabindex="-1"
              >
                <span data-i18n="arduino_code">Arduino Code</span>
              </button>
            </li>
          </ul>

          <!-- Правая часть навбара -->
          <div class="d-flex align-items-center">
            <!-- Кнопки Save/Load -->
            <div class="btn-group me-3">
              <button id="save-state" class="btn btn-sm btn-success">
                <i class="bi bi-save"></i>
                <span data-i18n="save_state">Save</span>
              </button>
              <input type="file" id="load-state" class="d-none" accept=".json" />
              <button id="load-state-btn" class="btn btn-sm btn-primary">
                <i class="bi bi-folder2-open"></i>
                <span data-i18n="load_state">Load</span>
              </button>
            </div>

            <!-- Выбор языка -->
            <div class="dropdown me-2">
              <button
                class="btn btn-sm btn-outline-light dropdown-toggle"
                type="button"
                id="languageDropdown"
                data-bs-toggle="dropdown"
              >
                <i class="bi bi-translate"></i>
                <span id="current-language">English</span>
              </button>
              <ul class="dropdown-menu dropdown-menu-end">
                <li>
                  <a class="dropdown-item" href="#" data-lang="en">English</a>
                </li>
                <li>
                  <a class="dropdown-item" href="#" data-lang="ru">Русский</a>
                </li>
              </ul>
            </div>

            <!-- Тема -->
            <button
              id="theme-toggle"
              class="theme-toggle-button"
              type="button"
              aria-label="Switch to dark theme"
            >
              <span class="icon moon" aria-hidden="true"><i class="bi bi-moon"></i></span>
              <span class="icon sun" aria-hidden="true"><i class="bi bi-sun"></i></span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <main class="container" id="main" tabindex="-1">
      <h1 class="visually-hidden" data-i18n="title">LCD Character Generator</h1>
      <div class="row">
        <div class="col-md-12">
          <!-- Tab Content -->
          <div class="tab-content">
            <!-- Custom Character Tab -->
            <div
              class="tab-pane fade show active"
              id="tab-pixel"
              role="tabpanel"
              aria-labelledby="customCharacterLink"
            >
              <div class="workspace">
                <!-- Верхний ряд: редактор | живой предпросмотр | код -->
                <div class="workspace-main">
                  <!-- Пиксель-редактор -->
                  <section id="pixels" class="panel">
                    <h2 data-i18n="pixels">Pixels</h2>
                    <div id="pixel-grid"></div>
                    <div class="butContainer">
                      <button
                        id="clear"
                        class="btn btn-danger btn-custom"
                        type="button"
                        data-i18n="clear"
                      >
                        Clear
                      </button>
                      <button
                        id="invert"
                        class="btn btn-warning btn-custom"
                        type="button"
                        data-i18n="invert"
                      >
                        Invert
                      </button>
                      <button
                        id="reflectHorizontal"
                        class="btn btn-primary btn-custom"
                        type="button"
                        data-i18n="reflect_horizontal"
                      >
                        Reflect Horizontal
                      </button>
                      <button
                        id="reflectVertical"
                        class="btn btn-primary btn-custom"
                        type="button"
                        data-i18n="reflect_vertical"
                      >
                        Reflect Vertical
                      </button>
                    </div>
                  </section>

                  <!-- Живой предпросмотр на LCD -->
                  <section id="lcd-panel" class="panel">
                    <div class="lcd-panel-header">
                      <h3 data-i18n="preview">LCD Preview</h3>
                      <select
                        id="lcd-select"
                        aria-label="Display configuration"
                        data-i18n-aria-label="display_config"
                      >
                        <option value="16x2">16x2</option>
                        <option value="20x4">20x4</option>
                      </select>
                    </div>
                    <div
                      id="lcd-display"
                      class="lcd-display"
                      role="radiogroup"
                      aria-label="LCD display cells"
                      data-i18n-aria-label="lcd_cells_label"
                    >
                      <!-- Ячейки динамически создаются в JS -->
                    </div>
                  </section>

                  <!-- Вывод кода -->
                  <section id="code" class="panel">
                    <div class="code-header">
                      <h3 data-i18n="output">Вывод</h3>
                      <button
                        id="copy-char-btn"
                        class="btn btn-sm btn-outline-secondary btn-copy"
                        data-i18n="copy"
                      >
                        КОПИРОВАТЬ
                      </button>
                    </div>
                    <textarea
                      class="form-control output"
                      id="codeChar"
                      cols="30"
                      rows="10"
                      readonly
                      aria-label="Generated character bytes"
                      data-i18n-aria-label="character_bytes"
                    ></textarea>
                  </section>
                </div>

                <!-- Нижний ряд: кадры и управление анимацией -->
                <div class="animation-controls">
                  <div class="animation-controls-container">
                    <div class="saved-frames" id="savedFrames">
                      <div class="saved-frames-header">
                        <h3 data-i18n="saved_frames"></h3>
                        <span id="memory-status" data-i18n="remaining_memory">
                          Оставшаяся память: 320 байт
                        </span>
                      </div>
                      <p class="frames-hint" id="frames-hint" data-i18n="frames_hint"></p>
                      <!-- Статус редактирования кадра -->
                      <div id="editing-status" class="editing-status" hidden aria-live="polite">
                        <i class="bi bi-pencil-square editing-status-icon" aria-hidden="true"></i>
                        <span id="editing-frame-label" data-i18n="editing_frame"></span>
                        <span class="editing-status-hint" data-i18n="editing_hint"></span>
                        <button id="stop-editing-btn" class="btn btn-sm btn-outline-primary">
                          <i class="bi bi-check-lg" aria-hidden="true"></i>
                          <span data-i18n="done_editing"></span>
                        </button>
                      </div>
                      <div
                        class="frames-container"
                        id="framesContainer"
                        role="group"
                        aria-label="Saved frames"
                        data-i18n-aria-label="saved_frames"
                        aria-describedby="frames-hint"
                        tabindex="-1"
                      >
                        <!-- Frames will be dynamically added here -->
                      </div>
                    </div>
                    <!-- Animation Controls -->
                    <div class="controls">
                      <div class="fps-control">
                        <label for="fps" data-i18n="animation_fps">Animation FPS:</label>
                        <input type="range" id="fps" min="1" max="24" value="2" />
                        <span class="fps-value"
                          ><output id="fpsValue" for="fps">2</output> FPS</span
                        >
                      </div>
                      <div class="animation-buttons">
                        <button id="save-frame" class="btn btn-success" data-i18n="save_frame">
                          Save Frame
                        </button>
                        <button
                          id="play-animation"
                          class="btn btn-primary"
                          data-i18n="play_animation"
                        >
                          Play Animation
                        </button>
                      </div>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Toggle Button -->
              <button
                id="toggle-pdf-button"
                class="bookmark-button"
                type="button"
                aria-controls="pdf-panel"
                aria-expanded="false"
                data-i18n="symbols_table"
              >
                Symbols table
              </button>

              <!-- Side Panel for PDF -->
              <div id="pdf-panel" class="pdf-panel" inert>
                <!-- Добавляем выпадающий список для выбора PDF -->
                <select
                  id="pdf-select"
                  class="form-control"
                  aria-label="Symbols table"
                  data-i18n-aria-label="symbols_table"
                >
                  <option value="./assets/pdf/MT–20S4A_symbols_table.pdf" data-i18n="mt_20s4a">
                    MT–20S4A
                  </option>
                  <option value="./assets/pdf/HD44780U_symbols_table.pdf" data-i18n="hd44780u">
                    HD44780U
                  </option>
                </select>

                <!-- IFRAME для отображения PDF -->
                <iframe
                  id="pdf-viewer"
                  src="./assets/pdf/MT–20S4A_symbols_table.pdf"
                  width="100%"
                  height="100%"
                  title="Symbols table"
                  data-i18n-title="symbols_table"
                ></iframe>
              </div>

            </div>

            <!-- Arduino Code Tab -->
            <div
              class="tab-pane"
              id="tab-code"
              role="tabpanel"
              aria-labelledby="arduinoCodeLink"
              hidden
            >
              <h2 data-i18n="arduino_code">Arduino Code</h2>
              <div class="row mb-3">
                <div class="col-md-2 col-6">
                  <label for="RSPin" class="form-label">RS Pin</label>
                  <input type="number" id="RSPin" class="form-control" value="12" />
                </div>
                <div class="col-md-2 col-6">
                  <label for="EnablePin" class="form-label">Enable Pin</label>
                  <input type="number" id="EnablePin" class="form-control" value="11" />
                </div>
                <div class="col-md-2 col-6">
                  <label for="D4Pin" class="form-label">D4 Pin</label>
                  <input type="number" id="D4Pin" class="form-control" value="5" />
                </div>
                <div class="col-md-2 col-6">
                  <label for="D5Pin" class="form-label">D5 Pin</label>
                  <input type="number" id="D5Pin" class="form-control" value="4" />
                </div>
                <div class="col-md-2 col-6">
                  <label for="D6Pin" class="form-label">D6 Pin</label>
                  <input type="number" id="D6Pin" class="form-control" value="3" />
                </div>
                <div class="col-md-2 col-6">
                  <label for="D7Pin" class="form-label">D7 Pin</label>
                  <input type="number" id="D7Pin" class="form-control" value="2" />
                </div>
              </div>
              <div class="code-header">
                <h3 data-i18n="output">Вывод</h3>
                <button
                  id="copy-arduino-btn"
                  class="btn btn-sm btn-outline-secondary"
                  data-i18n="copy"
                >
                  КОПИРОВАТЬ
                </button>
              </div>
              <pre class="code-arduino">
                <code id="codeArduino" class="language-cpp"></code>
              </pre>
            </div>
          </div>
        </div>
      </div>
    </main>
    <footer class="bg-dark text-center">
      <!-- Grid container -->
      <div class="container p-4">
        <a
          target="_blank"
          href="https://github.com/zoom1fy/LCD-Character-Generator"
          data-i18n="project_source"
          >Project source on GitHub</a
        >
        <p data-i18n="license">Licensed under GNU GPL v3 or later</p>
      </div>
      <div class="copyright-bar text-center p-3" data-i18n="copyright">
        © 2026 Copyright:
        <a
          target="_blank"
          href="https://github.com/zoom1fy/LCD-Character-Generator"
          ><b>LCD-Character-Generator</b></a
        >
      </div>
      <!-- Copyright -->
    </footer>

    <script src="./assets/js/auxiliary/jquery-3.0.0.slim.min.js"></script>
    <script src="./assets/js/auxiliary/bootstrap.bundle.min.js"></script>
    <script src="./assets/js/translations.js"></script>
    <script src="./assets/js/alerts.js"></script>
    <script src="./assets/js/main.js"></script>
    <script src="./assets/js/lcd-display-controller.js"></script>
    <script src="./assets/js/arduino-code-gen.js"></script>
    <!-- Highlight.js скрипт -->
    <script src="./assets/js/auxiliary/highlight.min.js"></script>
  </body>
</html>
